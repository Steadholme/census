<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Groups · Census · HOLDFAST</title>
  <style>{{CSS}}</style>
</head>
<body class="page-console">
{{TOPBAR}}
<main class="console">
  <div class="console__head">
    <h1>Groups</h1>
    <p class="sub">Organize people into teams. Membership changes are audited.</p>
  </div>

  <section class="card">
    <div class="card__body">
      <h2 class="edit-card__head">Create a group</h2>
      <form class="member-add" method="post" action="/api/groups">
        <input type="hidden" name="csrf_token" value="{{CSRF}}">
        <input type="text" name="name" required maxlength="120" placeholder="Group name" aria-label="Group name">
        <input type="text" name="description" maxlength="2048" placeholder="Description (optional)" aria-label="Description">
        <button class="btn btn-primary" type="submit">Create</button>
      </form>
    </div>
  </section>

  <div class="group-grid">
    {{CARDS}}
  </div>
</main>
</body>
</html>
