<!DOCTYPE html>
<html lang="en"{{THEME_ATTR}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{COLOR_SCHEME}}">
  <title>Groups · Census · Steadholme</title>
  <link rel="stylesheet" href="{{CSS_PATH}}">
</head>
<body class="page-v2">
<a class="skip-link" href="#main">Skip to the registry</a>
{{APPBAR}}
<main class="v2-page" id="main" tabindex="-1">
  <div class="pagehead">
    <div class="pagehead__titles">
      <h1>Groups</h1>
    </div>
  </div>
  {{BANNER}}

  <section class="card" aria-labelledby="create-group-h">
    <div class="card__head"><h2 id="create-group-h">Create a group</h2></div>
    <div class="card__pad">
      {{CREATE_FORM}}
    </div>
    <p class="card__caption card__caption--foot">Curated by every signed-in member · joining grants no permission · a role is descriptive text · changes are recorded best-effort in the estate audit log.</p>
  </section>
  {{BOUNDARY}}

  <div class="group-grid">
    {{CARDS}}
  </div>
{{FOOTER}}
</main>
</body>
</html>
