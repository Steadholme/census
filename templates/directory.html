<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Directory · Census · Steadholme</title>
  <style>{{CSS}}</style>
</head>
<body class="page-reading">
{{TOPBAR}}
<main class="reader reader--wide">
  <div class="reader__head">
    <div>
      <h1 class="reader__title">People</h1>
      <p class="reader__sub">The Steadholme org directory — profiles &amp; groups over Keystone identities.</p>
    </div>
    <form class="searchbar searchbar--filters" method="get" action="/">
      <input type="search" name="q" value="{{QUERY}}" placeholder="Search name, department, group…" aria-label="Search the directory">
      <select name="dept" aria-label="Filter by department">
        {{DEPARTMENT_OPTIONS}}
      </select>
      <select name="group" aria-label="Filter by group">
        {{GROUP_OPTIONS}}
      </select>
      <button class="btn btn-primary" type="submit">Search</button>
    </form>
  </div>
  <div class="directory">
    <div class="directory__main">
      <div class="directory__count">{{COUNT}}</div>
      <div class="person-list">
        {{ROWS}}
      </div>
    </div>
    <aside class="directory__aside">
      <div class="panel">
        <div class="panel__head"><h2>Groups</h2><a class="panel__link" href="/groups">Manage</a></div>
        <ul class="grouplist">
          {{GROUPS}}
        </ul>
      </div>
      <div class="panel org-panel">
        <div class="panel__head"><h2>Org chart</h2></div>
        <div class="org-chart">
          {{ORG_CHART}}
        </div>
      </div>
    </aside>
  </div>
</main>
</body>
</html>
