[package]
name = "census"
version = "0.1.0"
edition = "2021"
description = "Census — people directory, profiles & groups layered over Keystone identities for the HOLDFAST stack."
license = "MIT OR Apache-2.0"

[lib]
name = "census"
path = "src/lib.rs"

[[bin]]
name = "census"
path = "src/main.rs"

[dependencies]
# Vendored Odyssey canonical CSS (font + tokens + shared components) for server-rendered pages.
odyssey = { path = "crates/odyssey" }
# HTTP framework (shared with keystone/inkwell/cortex): Form/Query/State/Path extractors,
# typed responses, JSON for the /api/people service feed.
axum = "0.8"
# Async runtime axum runs on. The Store + Directory traits are async: handlers `.await` them
# directly and the Postgres impls drive sqlx natively, so a worker thread is NEVER blocked
# (no sync-over-async bridge). `rt-multi-thread` keeps the serving runtime parallel.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
# Erase the async Store/Directory trait methods so `Arc<dyn _>` stays object-safe (the same
# seam as the rest of the estate).
async-trait = "0.1"
# Deserialize the urlencoded profile/group/member form bodies; serialize the audit events +
# the /api/people JSON feed.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error/store enums -> branded error page / HTTP status.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# Markdown -> HTML for the profile bio. We SANITIZE: raw HTML events are escaped to text and
# link/image URLs are scheme-allowlisted, so no raw HTML / `javascript:` injection survives.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Epoch -> UTC date components for "joined" / "updated" stamps (std only — no C deps).
time = { version = "0.3", default-features = false, features = ["std"] }
# CSPRNG bytes for the double-submit CSRF token + group ids. `getrandom` is a tiny libc-backed
# shim; `hex` encodes the token.
getrandom = "0.2"
hex = "0.4"
# Portable PostgreSQL data layer. Runtime queries only (sqlx::query/Row) — NO compile-time
# macros, so the build needs NO database. rustls TLS (no openssl). Standard SQL only, so the
# same statements later run unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
